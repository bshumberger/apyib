name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  test:
    defaults:
      run:
        shell: bash -l {0}

    name: Test ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Set up conda environment with Psi4 and dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          activate-environment: p4env
          environment-file: devtools/conda-envs/psi.yaml
          python-version: ${{ matrix.python-version }}
          auto-activate-base: false

      - name: Verify environment
        run: |
          conda info
          conda list
          python -c "import psi4; print('psi4', psi4.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Install apyib
        run: pip install -e . --no-deps

      - name: Run tests (excluding slow)
        env:
          OMP_NUM_THREADS: 1
        run: pytest apyib/tests/ -m "not slow" -n auto -v --cov=apyib --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Opt-in job for the slow tests (MP2/CID/CISD analytic Hessians and the
  # full VCD cases). Runs on the weekly schedule and on manual dispatch only,
  # so routine push/PR checks stay fast.
  slow-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash -l {0}

    name: Slow tests (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment with Psi4 and dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          activate-environment: p4env
          environment-file: devtools/conda-envs/psi.yaml
          python-version: '3.12'
          auto-activate-base: false

      - name: Install apyib
        run: pip install -e . --no-deps

      - name: Run slow tests
        env:
          OMP_NUM_THREADS: 1
        run: pytest apyib/tests/ -m slow -n auto -v
