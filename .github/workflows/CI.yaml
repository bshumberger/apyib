name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    - cron: "0 0 * * 0"

jobs:
  test:
    defaults:
      run:
        shell: bash -l {0}

    name: Test ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Set up conda environment with Psi4 and dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          activate-environment: p4env
          environment-file: devtools/conda-envs/psi.yaml
          python-version: ${{ matrix.python-version }}
          auto-activate-base: false

      - name: Verify environment
        run: |
          conda info
          conda list
          python -c "import psi4; print('psi4', psi4.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Install apyib
        run: pip install -e . --no-deps

      - name: Run tests (excluding slow)
        run: pytest apyib/tests/ -m "not slow" -v --cov=apyib --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
